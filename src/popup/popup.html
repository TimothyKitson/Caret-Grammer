<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Caret</title>
  <link rel="preload" href="../options/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../options/fonts/grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="popup.css">
</head>
<body data-state="loading">
  <header>
    <span class="logo"><img src="../../icons/icon128.png" alt="" width="30" height="30"></span>
    <h1>Caret</h1>
    <p class="pill"><span class="dot" aria-hidden="true"></span><span id="pill-text"></span></p>
  </header>

  <!-- What Caret is doing in this tab, right now: a line of text with a caret
       in front of it. The number only appears when there is a real count. -->
  <div class="readout">
    <span class="figure" aria-hidden="true"><span class="num" id="found" hidden></span><span class="caret"></span></span>
    <p class="status" id="status">Loading…</p>
  </div>

  <div class="group">
    <label class="row switch">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 20 20" width="16" height="16"><path d="M4 5.5h12M4 9.5h7"/><path d="M4 14.6q1.25-2.2 2.5 0t2.5 0 2.5 0 2.5 0"/></svg>
      </span>
      <span class="label">Check my writing</span>
      <input type="checkbox" id="enabled">
      <span class="track" aria-hidden="true"></span>
    </label>

    <label class="row switch">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 20 20" width="16" height="16"><circle cx="10" cy="10" r="7"/><path d="M3 10h14M10 3c2.4 2.4 2.4 11.6 0 14M10 3c-2.4 2.4-2.4 11.6 0 14"/></svg>
      </span>
      <span class="label">On <b id="site">this site</b></span>
      <input type="checkbox" id="site-enabled">
      <span class="track" aria-hidden="true"></span>
    </label>
  </div>

  <button id="check-ai" class="ai" hidden>
    <svg class="spark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path class="star" d="M10 3.5c.7 4.3 2.2 5.8 6.5 6.5-4.3.7-5.8 2.2-6.5 6.5-.7-4.3-2.2-5.8-6.5-6.5 4.3-.7 5.8-2.2 6.5-6.5z"/>
      <path class="star small" d="M18.5 14c.3 1.9 1 2.6 2.9 2.9-1.9.3-2.6 1-2.9 2.9-.3-1.9-1-2.6-2.9-2.9 1.9-.3 2.6-1 2.9-2.9z"/>
    </svg>
    <span class="ai-text">
      <span class="ai-label">Check with AI</span>
      <span class="ai-sub" id="check-ai-sub"></span>
    </span>
    <span class="combo" data-command="check-now" aria-hidden="true"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>.</kbd></span>
  </button>
  <!-- How many checks are left today, for each AI that is on: a line each,
       with a meter when there is a limit to measure against. -->
  <div class="card usage" id="usage" hidden>
    <div class="meter-row" id="ai-meta" hidden></div>
    <div class="meter-row quick-meta" id="quick-meta" hidden></div>
  </div>

  <ul class="card keys">
    <li>
      <span>Suggestions at the cursor</span>
      <span class="combo" data-command="show-suggestions"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>Space</kbd></span>
    </li>
    <li>
      <span>Proofread with AI</span>
      <span class="combo"><kbd>Right-click</kbd></span>
    </li>
  </ul>

  <footer>
    <button id="options">
      <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M3.5 6h6.5M15 6h1.5M3.5 14H5M10 14h6.5"/><circle cx="12.5" cy="6" r="2.2"/><circle cx="7.5" cy="14" r="2.2"/></svg>
      Settings
    </button>
    <button id="shortcuts">
      <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><rect x="2.5" y="5" width="15" height="10" rx="2.4"/><path d="M5.9 8.5h.2M8.6 8.5h.2M11.3 8.5h.2M14 8.5h.2M7 11.7h6"/></svg>
      Shortcuts
    </button>
    <span class="ver" id="ver"></span>
  </footer>
  <script src="popup.js" type="module"></script>
</body>
</html>
