# The Caret Worker. Deploy with:  npx wrangler deploy
#
# Needs two bindings, both set up by `npx wrangler kv namespace create CARET_KEYS`
# and the Workers AI binding below. Neither costs anything on the free plan.

name = "caret-ai"
main = "src/index.js"
compatibility_date = "2026-01-15"

# Workers AI. No account id or token needed - the binding is the credential.
[ai]
binding = "AI"

# Where the Caret keys and the per-key day counters live.
# Replace the id with the one `wrangler kv namespace create` prints.
[[kv_namespaces]]
binding = "KEYS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
# Leave MODEL and QUICK_MODEL unset to use the lists built into the Worker
# (full check: Llama 3.3 70B first; quick check: Granite 4.0 Micro first).
# Set them only to force a particular model to the front, for example
#   QUICK_MODEL = "@cf/google/gemma-4-26b-a4b-it"   better, ~3x the neurons
# 0 = no per-key cap on full checks. The extension limits each person instead.
PER_KEY_DAILY = "0"
